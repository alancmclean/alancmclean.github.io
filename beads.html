<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bead Pattern Designer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0f;
            --bg-surface: #14141c;
            --bg-elevated: #1c1c28;
            --bg-overlay: rgba(14, 14, 20, 0.95);
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --radius: 10px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        #beadCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }

        .toolbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-overlay);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            z-index: 100;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }

        .btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: relative;
        }

        .btn:hover { background: var(--border); color: var(--text-primary); }
        .btn:active { transform: scale(0.95); }
        .btn.active { background: var(--accent); color: white; }
        .btn svg { width: 20px; height: 20px; }

        .btn-color {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 2px solid var(--border);
            padding: 0;
        }

        .btn-color:hover { border-color: var(--border-hover); }

        .pan-hint {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-overlay);
            backdrop-filter: blur(20px);
            padding: 8px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            z-index: 100;
            opacity: 0.7;
        }

        .dropdown { position: relative; }

        .dropdown-panel {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-overlay);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px;
            min-width: 200px;
            display: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 200;
        }

        .dropdown.open .dropdown-panel { display: block; animation: fadeIn 0.15s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, border-color 0.1s;
        }

        .color-swatch:hover { transform: scale(1.1); }
        .color-swatch.active { border-color: white; }

        .color-custom {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .color-custom input {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-custom label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .shape-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .shape-btn {
            padding: 10px 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            font-family: inherit;
        }

        .shape-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .shape-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

        .grid-type-toggle {
            display: flex;
            background: var(--bg-base);
            border-radius: 6px;
            padding: 2px;
        }

        .grid-type-btn {
            flex: 1;
            padding: 8px 14px;
            font-size: 0.75rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
            font-family: inherit;
        }

        .grid-type-btn.active { background: var(--accent); color: white; }

        .panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            z-index: 500;
        }

        .panel-overlay.active { opacity: 1; visibility: visible; }

        .panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 320px;
            max-width: 90vw;
            background: var(--bg-surface);
            border-left: 1px solid var(--border);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 501;
            display: flex;
            flex-direction: column;
        }

        .panel-overlay.active .panel { transform: translateX(0); }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title { font-size: 1rem; font-weight: 600; }

        .panel-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .panel-close:hover { color: var(--text-primary); }

        .panel-tabs {
            display: flex;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
        }

        .panel-tab {
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .panel-tab:hover { color: var(--text-secondary); }
        .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .panel-section { display: none; }
        .panel-section.active { display: block; }

        .design-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .btn-action:hover { border-color: var(--border-hover); color: var(--text-primary); }
        .btn-action.primary { background: var(--accent); border-color: var(--accent); color: white; }
        .btn-action svg { width: 16px; height: 16px; }

        .design-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .design-card {
            background: var(--bg-elevated);
            border-radius: var(--radius);
            padding: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
        }

        .design-card:hover { border-color: var(--border-hover); }
        .design-card.active { border-color: var(--accent); }

        .design-thumbnail {
            aspect-ratio: 1;
            background: var(--bg-base);
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .design-thumbnail canvas { width: 100%; height: 100%; }

        .design-name {
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .template-card {
            background: var(--bg-elevated);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.15s;
        }

        .template-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .template-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .template-name { font-size: 0.75rem; color: var(--text-muted); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon { font-size: 2.5rem; margin-bottom: 8px; opacity: 0.5; }
        .empty-state-text { font-size: 0.85rem; }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            max-width: 360px;
            width: 90%;
            border: 1px solid var(--border);
            transform: scale(0.95);
            transition: transform 0.2s;
        }

        .modal-overlay.active .modal { transform: scale(1); }
        .modal h2 { font-size: 1.1rem; margin-bottom: 6px; }
        .modal p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }

        .modal input[type="text"] {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-family: inherit;
            margin-bottom: 16px;
        }

        .modal input[type="text"]:focus { outline: none; border-color: var(--accent); }

        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

        .modal-btn {
            padding: 10px 18px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .modal-btn-secondary {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .modal-btn-secondary:hover { border-color: var(--border-hover); color: var(--text-primary); }

        .modal-btn-primary {
            background: var(--accent);
            border: 1px solid var(--accent);
            color: white;
        }

        .modal-btn-primary:hover { background: var(--accent-hover); }

        .toast {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            font-size: 0.85rem;
            z-index: 1001;
            opacity: 0;
            transition: all 0.25s ease;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        [data-tooltip] { position: relative; }

        [data-tooltip]::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.15s;
            pointer-events: none;
            border: 1px solid var(--border);
        }

        [data-tooltip]:hover::after { opacity: 1; visibility: visible; }

        @media (max-width: 600px) {
            .toolbar { padding: 6px; gap: 4px; }
            .btn { width: 36px; height: 36px; }
            .btn svg { width: 18px; height: 18px; }
            .btn-color { width: 28px; height: 28px; }
            .toolbar-divider { margin: 0 2px; }
            [data-tooltip]::after { display: none; }
            .pan-hint { font-size: 0.65rem; padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <canvas id="beadCanvas"></canvas>

    <div class="toolbar">
        <button class="btn" onclick="openPanel()" data-tooltip="Library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>

        <div class="toolbar-divider"></div>

        <div class="dropdown" id="shapeDropdown">
            <button class="btn" onclick="toggleDropdown('shapeDropdown')" data-tooltip="Shape">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                </svg>
            </button>
            <div class="dropdown-panel">
                <div class="shape-grid" id="shapeGrid"></div>
            </div>
        </div>

        <div class="dropdown" id="colorDropdown">
            <button class="btn btn-color" id="colorBtn" onclick="toggleDropdown('colorDropdown')" data-tooltip="Color"></button>
            <div class="dropdown-panel">
                <div class="color-grid" id="colorPalette"></div>
                <div class="color-custom">
                    <input type="color" id="customColor" value="#6366f1">
                    <label>Custom color</label>
                </div>
            </div>
        </div>

        <div class="toolbar-divider"></div>

        <button class="btn" id="eraserBtn" onclick="toggleEraser()" data-tooltip="Eraser">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 20H7L3 16l9-9 8 8-4 5"/><path d="M6.5 13.5l5 5"/>
            </svg>
        </button>

        <div class="dropdown" id="layoutDropdown">
            <button class="btn" onclick="toggleDropdown('layoutDropdown')" data-tooltip="Layout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/>
                </svg>
            </button>
            <div class="dropdown-panel">
                <div class="grid-type-toggle">
                    <button class="grid-type-btn active" data-grid="offset" onclick="setGridType('offset')">Offset</button>
                    <button class="grid-type-btn" data-grid="square" onclick="setGridType('square')">Square</button>
                </div>
            </div>
        </div>

        <button class="btn" onclick="clearCanvas()" data-tooltip="Clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
        </button>

        <div class="toolbar-divider"></div>

        <button class="btn" onclick="exportDesign()" data-tooltip="Export">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
        </button>
    </div>

    <div class="pan-hint">Middle-click + drag or two fingers to pan</div>

    <div class="panel-overlay" id="panelOverlay" onclick="closePanel()">
        <div class="panel" onclick="event.stopPropagation()">
            <div class="panel-header">
                <span class="panel-title">Library</span>
                <button class="panel-close" onclick="closePanel()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="panel-tabs">
                <button class="panel-tab active" data-tab="designs" onclick="switchPanelTab('designs')">Designs</button>
                <button class="panel-tab" data-tab="templates" onclick="switchPanelTab('templates')">Templates</button>
            </div>
            <div class="panel-content">
                <div class="panel-section active" id="designsSection">
                    <div class="design-actions">
                        <button class="btn-action primary" onclick="newDesign()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            New
                        </button>
                        <button class="btn-action" onclick="duplicateDesign()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy
                        </button>
                        <button class="btn-action" onclick="deleteDesign()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                            Delete
                        </button>
                    </div>
                    <div class="design-grid" id="designGrid"></div>
                </div>
                <div class="panel-section" id="templatesSection">
                    <div class="template-grid" id="templateGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="saveModal">
        <div class="modal">
            <h2>Save Design</h2>
            <p>Give your design a name</p>
            <input type="text" id="designName" placeholder="My pattern...">
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal('saveModal')">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="confirmSave()">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h2>Delete Design?</h2>
            <p>This cannot be undone.</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const BEAD_SIZE = 20;
        const BEAD_GAP = 3;
        const CELL = BEAD_SIZE + BEAD_GAP;

        const state = {
            currentDesignId: null,
            designs: [],
            gridType: 'offset',
            beadShape: 'round',
            currentColor: '#6366f1',
            beads: {},
            isEraser: false,
            isPainting: false,
            isPanning: false,
            panStartX: 0,
            panStartY: 0,
            offsetX: 0,
            offsetY: 0
        };

        const COLORS = [
            '#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#0ea5e9',
            '#6366f1', '#8b5cf6', '#d946ef', '#ec4899', '#78716c', '#171717',
            '#ffffff', '#a3a3a3', '#525252', '#fbbf24', '#a3e635', '#2dd4bf'
        ];

        const SHAPES = [
            { id: 'round', name: 'Round' },
            { id: 'bicone', name: 'Bicone' },
            { id: 'oval', name: 'Oval' },
            { id: 'faceted', name: 'Faceted' },
            { id: 'cube', name: 'Cube' },
            { id: 'teardrop', name: 'Teardrop' }
        ];

        const TEMPLATES = [
            { name: 'Heart', icon: '❤️', fn: genHeart },
            { name: 'Star', icon: '⭐', fn: genStar },
            { name: 'Diamond', icon: '💎', fn: genDiamond },
            { name: 'Flower', icon: '🌸', fn: genFlower },
            { name: 'Circle', icon: '⚪', fn: genCircle },
            { name: 'Chevron', icon: '🔷', fn: genChevron },
            { name: 'Stripes', icon: '📊', fn: genStripes },
            { name: 'Checker', icon: '🏁', fn: genChecker },
            { name: 'Lemon', icon: '🍋', fn: genLemon },
            { name: 'Watermelon', icon: '🍉', fn: genWatermelon },
            { name: 'Apple', icon: '🍎', fn: genApple },
            { name: 'Orange', icon: '🍊', fn: genOrange },
            { name: 'Strawberry', icon: '🍓', fn: genStrawberry },
            { name: 'Cherry', icon: '🍒', fn: genCherry },
            { name: 'Grapes', icon: '🍇', fn: genGrapes },
            { name: 'Pineapple', icon: '🍍', fn: genPineapple },
            { name: 'Banana', icon: '🍌', fn: genBanana },
            { name: 'Peach', icon: '🍑', fn: genPeach }
        ];

        const canvas = document.getElementById('beadCanvas');
        const ctx = canvas.getContext('2d');

        function init() {
            initColorPalette();
            initShapeGrid();
            initTemplates();
            loadDesigns();
            if (state.designs.length > 0) selectDesign(state.designs[0].id);
            else resetCanvas();
            setColor(state.currentColor);
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function initColorPalette() {

                s.className = 'color-swatch';
                s.style.background = c;
                s.onclick = () => setColor(c);
                el.appendChild(s);
            });
        }

        function initShapeGrid() {
            const el = document.getElementById('shapeGrid');
            SHAPES.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'shape-btn' + (s.id === state.beadShape ? ' active' : '');

                };

        function initTemplates() {
            const el = document.getElementById('templateGrid');
            TEMPLATES.forEach(t => {
                const card = document.createElement('div');
                card.className = 'template-card';
                card.innerHTML = `<div class="template-icon">${t.icon}</div><div class="template-name">${t.name}</div>`;

        function resetCanvas() {
            state.beads = {};
            state.offsetX = 0;
            state.offsetY = 0;
            render();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        }

        function render() {
            // Dark background
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calculate visible grid area
            const startCol = Math.floor(-state.offsetX / CELL) - 2;
            const endCol = Math.ceil((canvas.width - state.offsetX) / CELL) + 2;
            const startRow = Math.floor(-state.offsetY / CELL) - 2;
            const endRow = Math.ceil((canvas.height - state.offsetY) / CELL) + 2;

            // Draw empty slots for visible area
            for (let r = startRow; r < endRow; r++) {
                for (let c = startCol; c < endCol; c++) {
                    const pos = getBeadScreenPosition(r, c);
                    if (!state.beads[`${r},${c}`]) {
                        drawEmpty(pos.x, pos.y, BEAD_SIZE / 2);
                    }
                }
            }

            // Draw all beads
            Object.entries(state.beads).forEach(([key, bead]) => {
                const [r, c] = key.split(',').map(Number);
                const pos = getBeadScreenPosition(r, c);
                // Only draw if on screen
                if (pos.x > -BEAD_SIZE && pos.x < canvas.width + BEAD_SIZE &&
                    pos.y > -BEAD_SIZE && pos.y < canvas.height + BEAD_SIZE) {
                    drawBead(pos.x, pos.y, BEAD_SIZE / 2, bead.color, bead.shape || state.beadShape);
                }
            });
        }

        function getBeadScreenPosition(row, col) {
            const offsetX = (state.gridType === 'offset' && row % 2) ? BEAD_SIZE / 2 : 0;
            return {
                x: col * CELL + state.offsetX + offsetX + BEAD_SIZE / 2,
                y: row * CELL + state.offsetY + BEAD_SIZE / 2
            };
        }

        function getGridPosition(screenX, screenY) {
            // Approximate row first (ignoring offset)
            const approxRow = Math.round((screenY - state.offsetY - BEAD_SIZE / 2) / CELL);
            const offsetX = (state.gridType === 'offset' && approxRow % 2) ? BEAD_SIZE / 2 : 0;
            const col = Math.round((screenX - state.offsetX - offsetX - BEAD_SIZE / 2) / CELL);
            return { r: approxRow, c: col };
        }

        function drawBead(x, y, r, color, shape) {
            ctx.save();
            const fn = { round: drawRound, bicone: drawBicone, oval: drawOval, faceted: drawFaceted, cube: drawCube, teardrop: drawTeardrop }[shape];
            if (fn) fn(x, y, r, color);
            ctx.restore();
        }

        function drawRound(x, y, r, c) {
            const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
            g.addColorStop(0, lighten(c, 50)); g.addColorStop(0.5, c); g.addColorStop(1, darken(c, 35));
            ctx.beginPath(); ctx.arc(x, y, r * 0.9, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
            ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.18, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
        }

        function drawBicone(x, y, r, c) {
            ctx.beginPath(); ctx.moveTo(x, y - r * 0.9); ctx.lineTo(x + r * 0.8, y); ctx.lineTo(x, y + r * 0.9); ctx.lineTo(x - r * 0.8, y); ctx.closePath();
            const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
            g.addColorStop(0, lighten(c, 35)); g.addColorStop(0.5, c); g.addColorStop(1, darken(c, 25)); ctx.fillStyle = g; ctx.fill();
            ctx.strokeStyle = darken(c, 45); ctx.lineWidth = 0.5;
            ctx.beginPath(); ctx.moveTo(x, y - r * 0.9); ctx.lineTo(x, y + r * 0.9); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x - r * 0.8, y); ctx.lineTo(x + r * 0.8, y); ctx.stroke();
        }

        function drawOval(x, y, r, c) {
            ctx.beginPath(); ctx.ellipse(x, y, r * 0.65, r * 0.9, 0, 0, Math.PI * 2);
            const g = ctx.createRadialGradient(x - r * 0.2, y - r * 0.3, 0, x, y, r);
            g.addColorStop(0, lighten(c, 50)); g.addColorStop(0.6, c); g.addColorStop(1, darken(c, 35)); ctx.fillStyle = g; ctx.fill();
        }

        function drawFaceted(x, y, r, c) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 2; const px = x + Math.cos(a) * r * 0.85; const py = y + Math.sin(a) * r * 0.85; i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
            ctx.closePath();
            const g = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
            g.addColorStop(0, lighten(c, 35)); g.addColorStop(0.5, c); g.addColorStop(1, darken(c, 25)); ctx.fillStyle = g; ctx.fill();
            ctx.strokeStyle = darken(c, 35); ctx.lineWidth = 0.5;
            for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 - Math.PI / 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * r * 0.85, y + Math.sin(a) * r * 0.85); ctx.stroke(); }
        }

        function drawCube(x, y, r, c) {
            const s = r * 0.75;
            ctx.fillStyle = c; ctx.fillRect(x - s, y - s, s * 2, s * 2);
            ctx.fillStyle = lighten(c, 25); ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x - s * 0.5, y - s * 1.25); ctx.lineTo(x + s * 1.5, y - s * 1.25); ctx.lineTo(x + s, y - s); ctx.closePath(); ctx.fill();
            ctx.fillStyle = darken(c, 25); ctx.beginPath(); ctx.moveTo(x + s, y - s); ctx.lineTo(x + s * 1.5, y - s * 1.25); ctx.lineTo(x + s * 1.5, y + s * 0.75); ctx.lineTo(x + s, y + s); ctx.closePath(); ctx.fill();
        }

        function drawTeardrop(x, y, r, c) {
            ctx.beginPath(); ctx.moveTo(x, y - r * 0.9); ctx.quadraticCurveTo(x + r * 0.9, y - r * 0.3, x + r * 0.6, y + r * 0.5); ctx.quadraticCurveTo(x, y + r * 0.9, x - r * 0.6, y + r * 0.5); ctx.quadraticCurveTo(x - r * 0.9, y - r * 0.3, x, y - r * 0.9); ctx.closePath();
            const g = ctx.createRadialGradient(x - r * 0.2, y - r * 0.2, 0, x, y, r);
            g.addColorStop(0, lighten(c, 50)); g.addColorStop(0.6, c); g.addColorStop(1, darken(c, 35)); ctx.fillStyle = g; ctx.fill();
        }

        function drawEmpty(x, y, r) {
            ctx.beginPath(); ctx.arc(x, y, r * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.015)'; ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1; ctx.stroke();
        }

        function lighten(c, p) { const n = parseInt(c.slice(1), 16); const a = Math.round(2.55 * p); return '#' + [16, 8, 0].map(s => Math.min(255, ((n >> s) & 0xFF) + a).toString(16).padStart(2, '0')).join(''); }
        function darken(c, p) { const n = parseInt(c.slice(1), 16); const a = Math.round(2.55 * p); return '#' + [16, 8, 0].map(s => Math.max(0, ((n >> s) & 0xFF) - a).toString(16).padStart(2, '0')).join(''); }

        // Input handling
        function paint(x, y) {
            const pos = getGridPosition(x, y);
            const k = `${pos.r},${pos.c}`;
            if (state.isEraser) {
                delete state.beads[k];
            } else {
                state.beads[k] = { color: state.currentColor, shape: state.beadShape };
            }
            render();
            scheduleAutoSave();
        }

        // Mouse events
        canvas.addEventListener('mousedown', e => {
            if (e.button === 1) {
                // Middle click - start panning
                e.preventDefault();
                state.isPanning = true;
                state.panStartX = e.clientX - state.offsetX;
                state.panStartY = e.clientY - state.offsetY;
                canvas.style.cursor = 'grabbing';
            } else if (e.button === 0) {
                // Left click - paint
                e.preventDefault();
                state.isPainting = true;
                paint(e.clientX, e.clientY);
            }
        });

        canvas.addEventListener('mousemove', e => {
            if (state.isPanning) {
                state.offsetX = e.clientX - state.panStartX;
                state.offsetY = e.clientY - state.panStartY;
                render();
            } else if (state.isPainting) {
                paint(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mouseup', e => {
            if (e.button === 1) {
                state.isPanning = false;
                canvas.style.cursor = 'crosshair';
            } else if (e.button === 0) {
                state.isPainting = false;
            }
        });

        canvas.addEventListener('contextmenu', e => {
            e.preventDefault();
            const pos = getGridPosition(e.clientX, e.clientY);
            delete state.beads[`${pos.r},${pos.c}`];
            render();
            scheduleAutoSave();
        });

        // Prevent middle click scroll
        canvas.addEventListener('auxclick', e => e.button === 1 && e.preventDefault());

        // Touch events
        let touchMode = null;
        let lastTouchDist = 0;
        let lastTouchCenter = { x: 0, y: 0 };

        canvas.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                // Single finger - paint
                touchMode = 'paint';
                state.isPainting = true;
                paint(e.touches[0].clientX, e.touches[0].clientY);
            } else if (e.touches.length === 2) {
                // Two fingers - pan
                touchMode = 'pan';
                state.isPainting = false;
                const t1 = e.touches[0], t2 = e.touches[1];
                lastTouchCenter = {
                    x: (t1.clientX + t2.clientX) / 2,
                    y: (t1.clientY + t2.clientY) / 2
                };
                state.panStartX = lastTouchCenter.x - state.offsetX;
                state.panStartY = lastTouchCenter.y - state.offsetY;
            }
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            if (touchMode === 'paint' && e.touches.length === 1) {
                paint(e.touches[0].clientX, e.touches[0].clientY);
            } else if (touchMode === 'pan' && e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const center = {
                    x: (t1.clientX + t2.clientX) / 2,
                    y: (t1.clientY + t2.clientY) / 2
                };
                state.offsetX = center.x - state.panStartX;
                state.offsetY = center.y - state.panStartY;
                render();
            }
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            if (e.touches.length === 0) {
                touchMode = null;
                state.isPainting = false;
            } else if (e.touches.length === 1 && touchMode === 'pan') {
                // Switched from 2 fingers to 1 - switch to paint mode
                touchMode = 'paint';
                state.isPainting = true;
            }
        });

        // Controls
        document.getElementById('customColor').addEventListener('input', e => setColor(e.target.value));

        function setGridType(t) { state.gridType = t; document.querySelectorAll('.grid-type-btn').forEach(b => b.classList.toggle('active', b.dataset.grid === t)); render(); scheduleAutoSave(); }
        function toggleEraser() { state.isEraser = !state.isEraser; document.getElementById('eraserBtn').classList.toggle('active', state.isEraser); }
        function clearCanvas() { if (Object.keys(state.beads).length && !confirm('Clear all beads?')) return; resetCanvas(); scheduleAutoSave(); }

        function setColor(c) {
            state.currentColor = c;
            document.getElementById('colorBtn').style.background = c;
            document.getElementById('customColor').value = c;
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('active', s.style.background === c));
        }

        function toggleDropdown(id) {
            const d = document.getElementById(id);
            const open = d.classList.contains('open');
            document.querySelectorAll('.dropdown').forEach(x => x.classList.remove('open'));
            if (!open) d.classList.add('open');
        }

        document.addEventListener('click', e => { if (!e.target.closest('.dropdown')) document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open')); });

        // Panel
        function openPanel() { document.getElementById('panelOverlay').classList.add('active'); }
        function closePanel() { document.getElementById('panelOverlay').classList.remove('active'); }
        function switchPanelTab(t) {
            document.querySelectorAll('.panel-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === t));
            document.querySelectorAll('.panel-section').forEach(x => x.classList.toggle('active', x.id === t + 'Section'));
        }

        // Storage
        const STORAGE = 'beadDesigns';
        function loadDesigns() { try { state.designs = JSON.parse(localStorage.getItem(STORAGE)) || []; } catch { state.designs = []; } renderDesigns(); }
        function saveDesigns() { localStorage.setItem(STORAGE, JSON.stringify(state.designs)); }

        function getCurrentData() {
            return {
                gridType: state.gridType,
                beads: { ...state.beads },
                offsetX: state.offsetX,
                offsetY: state.offsetY
            };
        }

        function loadDesignData(d) {
            state.gridType = d.gridType || 'offset';
            state.beads = { ...d.beads } || {};
            state.offsetX = d.offsetX || 0;
            state.offsetY = d.offsetY || 0;
            document.querySelectorAll('.grid-type-btn').forEach(b => b.classList.toggle('active', b.dataset.grid === state.gridType));
            render();
        }

        let autoSave = null;
        function scheduleAutoSave() { clearTimeout(autoSave); autoSave = setTimeout(() => { if (state.currentDesignId) { const d = state.designs.find(x => x.id === state.currentDesignId); if (d) { Object.assign(d, getCurrentData()); d.modified = Date.now(); saveDesigns(); renderDesigns(); } } }, 2000); }

        function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
        function newDesign() { document.getElementById('designName').value = `Design ${state.designs.length + 1}`; openModal('saveModal'); }
        function confirmSave() { const d = { id: genId(), name: document.getElementById('designName').value.trim() || 'Untitled', created: Date.now(), modified: Date.now(), ...getCurrentData() }; state.designs.unshift(d); state.currentDesignId = d.id; saveDesigns(); renderDesigns(); closeModal('saveModal'); toast('Design saved'); }
        function duplicateDesign() { if (!state.currentDesignId) return toast('Select a design'); const o = state.designs.find(x => x.id === state.currentDesignId); if (!o) return; const d = { ...JSON.parse(JSON.stringify(o)), id: genId(), name: o.name + ' copy', created: Date.now(), modified: Date.now() }; state.designs.unshift(d); state.currentDesignId = d.id; saveDesigns(); renderDesigns(); toast('Duplicated'); }
        function deleteDesign() { if (!state.currentDesignId) return toast('Select a design'); openModal('deleteModal'); }
        function confirmDelete() { state.designs = state.designs.filter(x => x.id !== state.currentDesignId); state.currentDesignId = null; resetCanvas(); saveDesigns(); renderDesigns(); closeModal('deleteModal'); toast('Deleted'); if (state.designs.length) selectDesign(state.designs[0].id); }
        function selectDesign(id) { state.currentDesignId = id; const d = state.designs.find(x => x.id === id); if (d) loadDesignData(d); renderDesigns(); }

        function renderDesigns() {
            const el = document.getElementById('designGrid');
            if (!state.designs.length) { el.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">🎨</div><div class="empty-state-text">No designs yet</div></div>'; return; }
            el.innerHTML = '';
            state.designs.forEach(d => {
                const card = document.createElement('div');
                card.className = 'design-card' + (d.id === state.currentDesignId ? ' active' : '');
                card.onclick = () => selectDesign(d.id);
                const thumb = document.createElement('div'); thumb.className = 'design-thumbnail';
                const c = document.createElement('canvas'); c.width = 80; c.height = 80; renderThumb(c, d); thumb.appendChild(c);
                const name = document.createElement('div'); name.className = 'design-name'; name.textContent = d.name;
                card.append(thumb, name);
                el.appendChild(card);
            });
        }

        function renderThumb(c, d) {
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#1c1c28';
            ctx.fillRect(0, 0, 80, 80);

            const keys = Object.keys(d.beads);
            if (!keys.length) return;

            let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
            keys.forEach(k => {
                const [r, col] = k.split(',').map(Number);
                minR = Math.min(minR, r); maxR = Math.max(maxR, r);
                minC = Math.min(minC, col); maxC = Math.max(maxC, col);
            });

            const rows = maxR - minR + 1;
            const cols = maxC - minC + 1;
            const scale = Math.min(70 / cols, 70 / rows);
            const ox = (80 - cols * scale) / 2;
            const oy = (80 - rows * scale) / 2;

            Object.entries(d.beads).forEach(([k, b]) => {
                const [r, col] = k.split(',').map(Number);
                const offsetX = (d.gridType === 'offset' && r % 2) ? scale / 2 : 0;
                const x = ox + (col - minC) * scale + offsetX + scale / 2;
                const y = oy + (r - minR) * scale + scale / 2;
                ctx.beginPath();
                ctx.arc(x, y, scale * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
            });
        }

        // Templates
        function applyTemplate(t) {
            if (Object.keys(state.beads).length && !confirm(`Apply ${t.name}? This will replace current design.`)) return;
            resetCanvas();
            // Center template on screen
            const centerRow = Math.floor(canvas.height / 2 / CELL);
            const centerCol = Math.floor(canvas.width / 2 / CELL);
            const size = 25;
            t.fn(size, size, state.currentColor).forEach(b => {
                const r = b.r + centerRow - Math.floor(size / 2);
                const c = b.c + centerCol - Math.floor(size / 2);
                state.beads[`${r},${c}`] = { color: b.color, shape: state.beadShape };
            });
            render();
            scheduleAutoSave();
            closePanel();
            toast(`${t.name} applied`);
        }

        function genHeart(w, h, c) { const b = [], cx = w / 2, cy = h / 2, s = Math.min(w, h) * 0.4; for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) { const x = (col - cx) / s, y = (r - cy) / s; if ((x * x + y * y - 1) ** 3 - x * x * y * y * y <= 0) b.push({ r, c: col, color: c }); } return b; }
        function genStar(w, h, c) { const b = [], cx = w / 2, cy = h / 2, oR = Math.min(w, h) * 0.45, iR = oR * 0.4; for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) { const dx = col - cx, dy = r - cy, a = Math.atan2(dy, dx) + Math.PI / 2, d = Math.sqrt(dx * dx + dy * dy), sa = ((a % (Math.PI * 2 / 5)) / (Math.PI * 2 / 5)) * Math.PI; if (d <= iR + (oR - iR) * Math.abs(Math.cos(sa * 2.5))) b.push({ r, c: col, color: c }); } return b; }
        function genDiamond(w, h, c) { const b = [], cx = w / 2, cy = h / 2, s = Math.min(w, h) * 0.4; for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) if (Math.abs(col - cx) / s + Math.abs(r - cy) / s <= 1) b.push({ r, c: col, color: c }); return b; }
        function genFlower(w, h, c) { const b = [], cx = w / 2, cy = h / 2, pR = Math.min(w, h) * 0.35, cR = Math.min(w, h) * 0.15; for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) { const d = Math.sqrt((col - cx) ** 2 + (r - cy) ** 2); if (d <= cR) { b.push({ r, c: col, color: '#fbbf24' }); continue; } for (let p = 0; p < 6; p++) { const px = cx + Math.cos(p / 6 * Math.PI * 2) * pR * 0.5, py = cy + Math.sin(p / 6 * Math.PI * 2) * pR * 0.5; if (Math.sqrt((col - px) ** 2 + (r - py) ** 2) <= pR * 0.5) { b.push({ r, c: col, color: c }); break; } } } return b; }
        function genCircle(w, h, c) { const b = [], cx = w / 2, cy = h / 2, rad = Math.min(w, h) * 0.4; for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) if (Math.sqrt((col - cx) ** 2 + (r - cy) ** 2) <= rad) b.push({ r, c: col, color: c }); return b; }
        function genChevron(w, h, c) { const b = [], sh = Math.max(3, Math.floor(h / 6)); for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) if ((r + Math.abs(col - w / 2)) % (sh * 2) < sh) b.push({ r, c: col, color: c }); return b; }
        function genStripes(w, h, c) { const b = [], sw = Math.max(2, Math.floor(w / 8)); for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) if (Math.floor(col / sw) % 2 === 0) b.push({ r, c: col, color: c }); return b; }
        function genChecker(w, h, c) { const b = [], s = Math.max(2, Math.floor(Math.min(w, h) / 8)); for (let r = 0; r < h; r++) for (let col = 0; col < w; col++) if ((Math.floor(col / s) + Math.floor(r / s)) % 2 === 0) b.push({ r, c: col, color: c }); return b; }

        // Fruit templates
        function genLemon(w, h, c) {
            const b = [], cx = w / 2, cy = h / 2;
            const rx = Math.min(w, h) * 0.35, ry = Math.min(w, h) * 0.28;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    const dx = (col - cx) / rx, dy = (r - cy) / ry;
                    if (dx * dx + dy * dy <= 1) {
                        // Lemon body - yellow with lighter center
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 0.5) b.push({ r, c: col, color: '#fef08a' }); // light yellow center
                        else b.push({ r, c: col, color: '#facc15' }); // yellow
                    }
                    // Lemon tips
                    const tipL = Math.sqrt((col - (cx - rx * 1.1)) ** 2 + (r - cy) ** 2);
                    const tipR = Math.sqrt((col - (cx + rx * 1.1)) ** 2 + (r - cy) ** 2);
                    if (tipL <= 2 || tipR <= 2) b.push({ r, c: col, color: '#facc15' });
                }
            }
            return b;
        }

        function genWatermelon(w, h, c) {
            const b = [], cx = w / 2, cy = h * 0.6;
            const rad = Math.min(w, h) * 0.4;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    const d = Math.sqrt((col - cx) ** 2 + (r - cy) ** 2);
                    if (d <= rad && r <= cy) {
                        // Slice shape (top half of circle)
                        if (d > rad * 0.85) b.push({ r, c: col, color: '#166534' }); // dark green rind
                        else if (d > rad * 0.75) b.push({ r, c: col, color: '#22c55e' }); // light green
                        else if (d > rad * 0.65) b.push({ r, c: col, color: '#fef9c3' }); // white-ish
                        else {
                            // Red flesh with seeds
                            const seedPattern = (col + r * 3) % 7 === 0 && d > rad * 0.2 && d < rad * 0.55;
                            if (seedPattern) b.push({ r, c: col, color: '#1c1917' }); // seeds
                            else b.push({ r, c: col, color: '#ef4444' }); // red flesh
                        }
                    }
                }
            }
            return b;
        }

        function genApple(w, h, c) {
            const b = [], cx = w / 2, cy = h / 2 + 1;
            const rad = Math.min(w, h) * 0.35;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    // Apple body (slightly heart-like shape)
                    const dx = (col - cx) / rad, dy = (r - cy) / rad;
                    const shape = dx * dx + (dy - Math.abs(dx) * 0.3) ** 2;
                    if (shape <= 1 && r > cy - rad * 0.9) {
                        // Red with highlight
                        if (dx < -0.3 && dy < -0.2) b.push({ r, c: col, color: '#fca5a5' }); // highlight
                        else b.push({ r, c: col, color: '#dc2626' }); // red
                    }
                    // Indent at top
                    if (r === Math.floor(cy - rad * 0.7) && Math.abs(col - cx) <= 1) continue;
                    // Stem
                    if (col === Math.floor(cx) && r >= cy - rad - 3 && r < cy - rad * 0.6) {
                        b.push({ r, c: col, color: '#78350f' }); // brown stem
                    }
                    // Leaf
                    if (r >= cy - rad - 2 && r <= cy - rad + 1 && col > cx && col <= cx + 3) {
                        if ((r - (cy - rad)) <= (col - cx) * 0.5) b.push({ r, c: col, color: '#22c55e' });
                    }
                }
            }
            return b;
        }

        function genOrange(w, h, c) {
            const b = [], cx = w / 2, cy = h / 2;
            const rad = Math.min(w, h) * 0.38;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    const d = Math.sqrt((col - cx) ** 2 + (r - cy) ** 2);
                    if (d <= rad) {
                        // Orange with segments hint
                        const angle = Math.atan2(r - cy, col - cx);
                        const segment = Math.floor((angle + Math.PI) / (Math.PI / 4)) % 2;
                        if (d < rad * 0.15) b.push({ r, c: col, color: '#fef3c7' }); // center
                        else if (segment === 0) b.push({ r, c: col, color: '#f97316' }); // orange
                        else b.push({ r, c: col, color: '#ea580c' }); // darker orange
                    }
                    // Small leaf/stem at top
                    if (r === Math.floor(cy - rad) && col === Math.floor(cx)) {
                        b.push({ r: r - 1, c: col, color: '#22c55e' });
                    }
                }
            }
            return b;
        }

        function genStrawberry(w, h, c) {
            const b = [], cx = w / 2, cy = h / 2;
            const rad = Math.min(w, h) * 0.35;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    // Strawberry shape (wider at top, pointed bottom)
                    const dy = (r - cy + rad * 0.5) / rad;
                    const widthAtY = Math.max(0, 1 - dy * 0.7);
                    const dx = Math.abs(col - cx) / (rad * widthAtY + 0.01);
                    if (dy >= -0.5 && dy <= 1.2 && dx <= 1 && widthAtY > 0.1) {
                        // Seeds pattern
                        const hasSeed = ((col + r) % 3 === 0) && ((col * r) % 5 < 2);
                        if (hasSeed && dy > -0.3) b.push({ r, c: col, color: '#fef08a' }); // yellow seeds
                        else b.push({ r, c: col, color: '#dc2626' }); // red body
                    }
                    // Green leaves at top
                    if (r < cy - rad * 0.3 && r > cy - rad * 0.7) {
                        const leafDist = Math.abs(col - cx);
                        if (leafDist <= rad * 0.8 && (r + leafDist * 0.5) < cy - rad * 0.1) {
                            b.push({ r, c: col, color: '#22c55e' });
                        }
                    }
                }
            }
            return b;
        }

        function genCherry(w, h, c) {
            const b = [];
            const rad = Math.min(w, h) * 0.18;
            const cx1 = w / 2 - rad * 1.2, cy1 = h / 2 + rad * 0.5;
            const cx2 = w / 2 + rad * 1.2, cy2 = h / 2 + rad * 0.5;
            const stemTop = h / 2 - rad * 2;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    // Left cherry
                    const d1 = Math.sqrt((col - cx1) ** 2 + (r - cy1) ** 2);
                    if (d1 <= rad) {
                        if (d1 < rad * 0.4 && col < cx1 && r < cy1) b.push({ r, c: col, color: '#fca5a5' }); // highlight
                        else b.push({ r, c: col, color: '#dc2626' }); // red
                    }
                    // Right cherry
                    const d2 = Math.sqrt((col - cx2) ** 2 + (r - cy2) ** 2);
                    if (d2 <= rad) {
                        if (d2 < rad * 0.4 && col < cx2 && r < cy2) b.push({ r, c: col, color: '#fca5a5' }); // highlight
                        else b.push({ r, c: col, color: '#dc2626' }); // red
                    }
                    // Stems (curved lines to center top)
                    const stemCx = w / 2, stemCy = stemTop;
                    // Left stem curve
                    if (r < cy1 - rad * 0.5 && r >= stemTop) {
                        const t = (r - stemTop) / (cy1 - rad * 0.5 - stemTop);
                        const expectedX = stemCx + (cx1 - stemCx) * t * t;
                        if (Math.abs(col - expectedX) < 1) b.push({ r, c: col, color: '#166534' });
                    }
                    // Right stem curve
                    if (r < cy2 - rad * 0.5 && r >= stemTop) {
                        const t = (r - stemTop) / (cy2 - rad * 0.5 - stemTop);
                        const expectedX = stemCx + (cx2 - stemCx) * t * t;
                        if (Math.abs(col - expectedX) < 1) b.push({ r, c: col, color: '#166534' });
                    }
                }
            }
            return b;
        }

        function genGrapes(w, h, c) {
            const b = [];
            const rad = Math.min(w, h) * 0.1;
            const cx = w / 2, startY = h / 2 - rad * 2;
            // Grape cluster pattern (triangular)
            const grapePositions = [
                [0, 0], // top
                [-1, 1], [1, 1], // row 2
                [-2, 2], [0, 2], [2, 2], // row 3
                [-1, 3], [1, 3], // row 4
                [0, 4] // bottom
            ];
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    // Draw each grape
                    for (const [gx, gy] of grapePositions) {
                        const gcx = cx + gx * rad * 1.1;
                        const gcy = startY + gy * rad * 1.1;
                        const d = Math.sqrt((col - gcx) ** 2 + (r - gcy) ** 2);
                        if (d <= rad) {
                            if (d < rad * 0.35 && col < gcx) b.push({ r, c: col, color: '#c084fc' }); // highlight
                            else b.push({ r, c: col, color: '#7c3aed' }); // purple
                        }
                    }
                    // Stem at top
                    if (r < startY && r > startY - 4 && Math.abs(col - cx) < 1) {
                        b.push({ r, c: col, color: '#166534' });
                    }
                }
            }
            return b;
        }

        function genPineapple(w, h, c) {
            const b = [], cx = w / 2, cy = h / 2 + 2;
            const rx = Math.min(w, h) * 0.28, ry = Math.min(w, h) * 0.38;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    // Pineapple body (oval)
                    const dx = (col - cx) / rx, dy = (r - cy) / ry;
                    if (dx * dx + dy * dy <= 1) {
                        // Diamond pattern
                        const patternX = Math.floor((col - cx + 50) / 3);
                        const patternY = Math.floor((r - cy + 50) / 3);
                        if ((patternX + patternY) % 2 === 0) b.push({ r, c: col, color: '#fbbf24' }); // yellow
                        else b.push({ r, c: col, color: '#d97706' }); // orange-brown
                    }
                    // Crown (leaves at top)
                    if (r < cy - ry * 0.8 && r > cy - ry * 1.8) {
                        const leafSpread = (cy - ry * 0.8 - r) * 0.4;
                        const distFromCenter = Math.abs(col - cx);
                        if (distFromCenter <= leafSpread + 1) {
                            // Multiple leaf shapes
                            const leafPattern = Math.abs((col - cx) * 2 + (r % 3));
                            if (leafPattern < 4) b.push({ r, c: col, color: '#22c55e' });
                        }
                    }
                }
            }
            return b;
        }

        function genBanana(w, h, c) {
            const b = [], cx = w / 2, cy = h / 2;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    // Curved banana shape
                    const dx = (col - cx) / (w * 0.35);
                    const curve = Math.sin(dx * Math.PI) * h * 0.25;
                    const bananaY = cy - curve;
                    const dist = Math.abs(r - bananaY);
                    const thickness = (1 - Math.abs(dx) * 0.8) * h * 0.12;
                    if (dist < thickness && Math.abs(dx) < 0.9) {
                        // Yellow with brown tips
                        if (Math.abs(dx) > 0.75) b.push({ r, c: col, color: '#78350f' }); // brown tips
                        else if (dist < thickness * 0.3) b.push({ r, c: col, color: '#fef08a' }); // light yellow
                        else b.push({ r, c: col, color: '#facc15' }); // yellow
                    }
                }
            }
            return b;
        }

        function genPeach(w, h, c) {
            const b = [], cx = w / 2, cy = h / 2;
            const rad = Math.min(w, h) * 0.36;
            for (let r = 0; r < h; r++) {
                for (let col = 0; col < w; col++) {
                    // Peach shape (heart-like, slightly indented at top)
                    const dx = (col - cx) / rad, dy = (r - cy) / rad;
                    // Indent at top
                    const indent = dy < -0.3 ? Math.abs(dx) * 0.3 : 0;
                    const shape = dx * dx + (dy + indent) ** 2;
                    if (shape <= 1) {
                        // Gradient from orange to pink
                        const gradient = (dx + dy) * 0.5;
                        if (gradient < -0.3) b.push({ r, c: col, color: '#fcd34d' }); // yellow-orange
                        else if (gradient < 0.2) b.push({ r, c: col, color: '#fb923c' }); // orange
                        else b.push({ r, c: col, color: '#f472b6' }); // pink blush
                    }
                    // Stem
                    if (col === Math.floor(cx) && r >= cy - rad - 2 && r < cy - rad * 0.7) {
                        b.push({ r, c: col, color: '#78350f' });
                    }
                    // Leaf
                    if (r >= cy - rad - 1 && r <= cy - rad + 2 && col > cx && col <= cx + 4) {
                        const leafShape = (r - (cy - rad)) <= (col - cx) * 0.6;
                        if (leafShape && col - cx > 1) b.push({ r, c: col, color: '#22c55e' });
                    }
                }
            }
            return b;
        }

        // Modal
        function openModal(id) { document.getElementById(id).classList.add('active'); const i = document.querySelector(`#${id} input[type="text"]`); if (i) setTimeout(() => i.focus(), 100); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); }));
        document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active')); });

        function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

        function exportDesign() {
            const keys = Object.keys(state.beads);
            if (!keys.length) return toast('Nothing to export');

            let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
            keys.forEach(k => {
                const [r, c] = k.split(',').map(Number);
                minR = Math.min(minR, r); maxR = Math.max(maxR, r);
                minC = Math.min(minC, c); maxC = Math.max(maxC, c);
            });

            const rows = maxR - minR + 1;
            const cols = maxC - minC + 1;
            const padding = 20;
            const exportCanvas = document.createElement('canvas');
            const offsetXAmount = state.gridType === 'offset' ? BEAD_SIZE / 2 : 0;
            exportCanvas.width = cols * CELL + offsetXAmount + padding * 2;
            exportCanvas.height = rows * CELL + padding * 2;
            const ectx = exportCanvas.getContext('2d');

            ectx.fillStyle = '#1c1c28';
            ectx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            Object.entries(state.beads).forEach(([k, b]) => {
                const [r, c] = k.split(',').map(Number);
                const ox = (state.gridType === 'offset' && r % 2) ? BEAD_SIZE / 2 : 0;
                const x = (c - minC) * CELL + padding + ox + BEAD_SIZE / 2;
                const y = (r - minR) * CELL + padding + BEAD_SIZE / 2;

                ectx.save();
                const fn = { round: drawRound, bicone: drawBicone, oval: drawOval, faceted: drawFaceted, cube: drawCube, teardrop: drawTeardrop }[b.shape || state.beadShape];
                const origCtx = ctx;
                window.ctx = ectx;
                if (fn) fn(x, y, BEAD_SIZE / 2, b.color);
                window.ctx = origCtx;
                ectx.restore();
            });

            const a = document.createElement('a');
            a.download = `bead-${Date.now()}.png`;
            a.href = exportCanvas.toDataURL();
            a.click();
            toast('Exported');
        }

        init();
    </script>
</body>
</html>
